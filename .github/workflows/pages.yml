name: Publish obatahi
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      build_type: ${{ steps.mode.outputs.build_type }}
    steps:
      - uses: actions/checkout@v6
      - name: Build and verify
        run: python3 scripts/verify.py
      - name: Check publishing mode
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')
          echo "build_type=$mode" >> "$GITHUB_OUTPUT"
          if [ "$mode" != "workflow" ]; then
            echo 'Automatic publishing is pending: set Settings > Pages > Source to GitHub Actions, then run this workflow.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    if: needs.build.outputs.build_type == 'workflow'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
